<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Review Cockpit panel on a GitHub pull request</title>
  <defs>
    <clipPath id="frame"><rect width="960" height="580" rx="12"/></clipPath>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6cf7"/><stop offset="1" stop-color="#5b2fc9"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="580" fill="#f6f8fa"/>

    <!-- Browser chrome -->
    <rect width="960" height="34" fill="#e9ecef"/>
    <circle cx="18" cy="17" r="5.5" fill="#ff5f57"/><circle cx="36" cy="17" r="5.5" fill="#febc2e"/><circle cx="54" cy="17" r="5.5" fill="#28c840"/>
    <rect x="80" y="8" width="520" height="18" rx="9" fill="#fff"/>
    <text x="94" y="21" font-size="11" fill="#59636e">github.com/acme/platform/pull/482/files</text>

    <!-- GitHub page (left) -->
    <rect x="0" y="34" width="600" height="546" fill="#fff"/>
    <text x="24" y="66" font-size="17" font-weight="600" fill="#1f2328">Add session refresh to auth middleware <tspan fill="#59636e" font-weight="400">#482</tspan></text>
    <rect x="24" y="78" width="54" height="20" rx="10" fill="#1f883d"/><text x="35" y="92" font-size="11" font-weight="600" fill="#fff">Open</text>
    <text x="86" y="92" font-size="12" fill="#59636e">octo-dev wants to merge 6 commits into main from feat/refresh</text>
    <line x1="0" y1="110" x2="600" y2="110" stroke="#d1d9e0"/>

    <!-- Diff file -->
    <rect x="24" y="126" width="552" height="430" rx="6" fill="#fff" stroke="#d1d9e0"/>
    <rect x="24" y="126" width="552" height="34" rx="6" fill="#f6f8fa"/>
    <rect x="24" y="152" width="552" height="8" fill="#f6f8fa"/>
    <line x1="24" y1="160" x2="576" y2="160" stroke="#d1d9e0"/>
    <text x="38" y="148" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">src/auth/session.ts</text>
    <text x="500" y="148" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+120 <tspan fill="#d1242f">−14</tspan></text>
    <g font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="25" y="162" width="550" height="20" fill="#ddf4ff"/><text x="38" y="176" fill="#59636e">@@ -40,9 +40,24 @@ export async function refreshSession(req, res) {</text>
      <text x="38" y="198" fill="#8c959f">40</text><text x="74" y="198" fill="#1f2328">  const session = await store.get(req.cookies.sid);</text>
      <rect x="25" y="204" width="550" height="20" fill="#ffebe9"/><text x="38" y="218" fill="#8c959f">41</text><text x="66" y="218" fill="#1f2328">-  if (!session) return res.status(401).end();</text>
      <rect x="25" y="224" width="550" height="20" fill="#dafbe1"/><text x="38" y="238" fill="#8c959f">41</text><text x="66" y="238" fill="#1f2328">+  if (!session || session.expiresAt &lt; now) {</text>
      <rect x="25" y="244" width="550" height="20" fill="#dafbe1"/><text x="38" y="258" fill="#8c959f">42</text><text x="66" y="258" fill="#1f2328">+    const token = req.headers['x-refresh-token'];</text>
      <rect x="25" y="264" width="550" height="20" fill="#dafbe1"/><text x="38" y="278" fill="#8c959f">43</text><text x="66" y="278" fill="#1f2328">+    if (token == session?.refreshToken) {</text>
      <rect x="25" y="284" width="550" height="20" fill="#dafbe1"/><text x="38" y="298" fill="#8c959f">44</text><text x="66" y="298" fill="#1f2328">+      return issueSession(res, session.userId);</text>
      <rect x="25" y="304" width="550" height="20" fill="#dafbe1"/><text x="38" y="318" fill="#8c959f">45</text><text x="66" y="318" fill="#1f2328">+    }</text>
      <rect x="25" y="324" width="550" height="20" fill="#dafbe1"/><text x="38" y="338" fill="#8c959f">46</text><text x="66" y="338" fill="#1f2328">+    return res.status(401).end();</text>
      <rect x="25" y="344" width="550" height="20" fill="#dafbe1"/><text x="38" y="358" fill="#8c959f">47</text><text x="66" y="358" fill="#1f2328">+  }</text>
      <text x="38" y="380" fill="#8c959f">48</text><text x="74" y="380" fill="#1f2328">  res.locals.user = session.user;</text>
    </g>
    <!-- Draft comment from AI finding -->
    <rect x="44" y="396" width="512" height="140" rx="6" fill="#fff" stroke="#d1d9e0"/>
    <rect x="44" y="396" width="512" height="30" rx="6" fill="#f6f8fa"/><rect x="44" y="418" width="512" height="8" fill="#f6f8fa"/>
    <circle cx="62" cy="411" r="8" fill="#c8b6f9"/>
    <text x="78" y="415" font-size="12" font-weight="600" fill="#1f2328">you <tspan font-weight="400" fill="#59636e">· line 43</tspan></text>
    <rect x="488" y="402" width="56" height="18" rx="9" fill="none" stroke="#9a6700"/><text x="499" y="415" font-size="10.5" fill="#9a6700">Pending</text>
    <text x="60" y="448" font-size="12.5" font-weight="600" fill="#1f2328">Refresh token compared with == and not rotated</text>
    <text x="60" y="470" font-size="12" fill="#1f2328">If both values are undefined, the check passes and any request</text>
    <text x="60" y="488" font-size="12" fill="#1f2328">without a token gets a new session. Use a constant-time compare</text>
    <text x="60" y="506" font-size="12" fill="#1f2328">and rotate the refresh token on every use.</text>

    <!-- Review Cockpit panel (right) -->
    <rect x="600" y="34" width="360" height="546" fill="#fff"/>
    <line x1="600" y1="34" x2="600" y2="580" stroke="#d1d9e0"/>
    <rect x="616" y="49" width="11" height="11" rx="3" fill="url(#mark)"/>
    <text x="634" y="59" font-size="10" font-weight="600" letter-spacing="0.8" fill="#59636e">REVIEW COCKPIT</text>
    <text x="910" y="60" font-size="13" fill="#59636e">↻</text><text x="934" y="60" font-size="15" fill="#59636e">×</text>
    <text x="616" y="84" font-size="13.5" font-weight="600" fill="#1f2328"><tspan fill="#59636e" font-weight="400">#482 </tspan>Add session refresh to auth middleware</text>
    <text x="616" y="102" font-size="11.5" fill="#59636e">@octo-dev · feat/refresh → main · ≈ 18 min left</text>
    <rect x="616" y="113" width="200" height="6" rx="3" fill="#eff2f5"/><rect x="616" y="113" width="73" height="6" rx="3" fill="#1a7f37"/>
    <text x="826" y="120" font-size="11.5" fill="#1f2328">4/11 viewed <tspan fill="#1a7f37">+312</tspan> <tspan fill="#d1242f">−48</tspan></text>
    <rect x="616" y="132" width="328" height="38" rx="6" fill="#fff8c5" stroke="#eac54f"/>
    <text x="628" y="148" font-size="11.5" fill="#1f2328"><tspan font-weight="600">New commits since your review</tspan> (2h ago).</text>
    <text x="628" y="163" font-size="11.5" fill="#0969da">Show only what changed →</text>

    <!-- Tabs -->
    <line x1="600" y1="196" x2="960" y2="196" stroke="#d1d9e0"/>
    <text x="620" y="190" font-size="12" font-weight="600" fill="#1f2328">Files</text>
    <rect x="652" y="179" width="18" height="15" rx="7.5" fill="#f6f8fa" stroke="#d1d9e0"/><text x="657" y="190" font-size="10" fill="#1f2328">7</text>
    <rect x="612" y="194" width="64" height="2" fill="#8250df"/>
    <text x="692" y="190" font-size="12" fill="#59636e">Conversations</text>
    <rect x="776" y="179" width="18" height="15" rx="7.5" fill="#f6f8fa" stroke="#d1d9e0"/><text x="781" y="190" font-size="10" fill="#1f2328">3</text>
    <text x="812" y="190" font-size="12" fill="#59636e">AI review</text>
    <rect x="872" y="179" width="18" height="15" rx="7.5" fill="#f6f8fa" stroke="#d1d9e0"/><text x="877" y="190" font-size="10" fill="#1f2328">2</text>

    <!-- Tools -->
    <rect x="616" y="206" width="214" height="26" rx="6" fill="#fff" stroke="#d1d9e0"/>
    <text x="626" y="223" font-size="11.5" fill="#8c959f">Filter files…  (Alt+/)</text>
    <rect x="836" y="206" width="108" height="26" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="846" y="223" font-size="11.5" fill="#1f2328">Riskiest first ▾</text>
    <line x1="600" y1="242" x2="960" y2="242" stroke="#d1d9e0"/>

    <!-- File list -->
    <g font-size="11.5">
      <text x="616" y="256" font-size="10" font-weight="600" letter-spacing="0.6" fill="#d1242f">HIGH RISK: START HERE</text><text x="922" y="256" font-size="10" font-weight="600" fill="#d1242f">0/2</text>

      <rect x="600" y="262" width="360" height="38" fill="#ddf4ff"/><rect x="600" y="262" width="2" height="38" fill="#0969da"/>
      <rect x="616" y="270" width="12" height="12" rx="3" fill="#fff" stroke="#8c959f"/>
      <text x="636" y="279" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#59636e">src/auth/<tspan fill="#1f2328">session.ts</tspan></text>
      <text x="636" y="294" font-size="10.5" fill="#d1242f">security · no tests in PR</text>
      <circle cx="844" cy="276" r="3.5" fill="#9a6700"/>
      <rect x="854" y="268" width="15" height="15" rx="3" fill="none" stroke="#d1d9e0"/><text x="858" y="279" font-size="9.5" font-weight="600" fill="#59636e">M</text>
      <text x="878" y="279" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+120 <tspan fill="#d1242f">−14</tspan></text>

      <rect x="616" y="310" width="12" height="12" rx="3" fill="#fff" stroke="#8c959f"/>
      <text x="636" y="319" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#59636e">db/migrations/<tspan fill="#1f2328">0042_refresh.sql</tspan></text>
      <text x="636" y="334" font-size="10.5" fill="#d1242f">migration</text>
      <rect x="854" y="308" width="15" height="15" rx="3" fill="none" stroke="#1a7f37"/><text x="858" y="319" font-size="9.5" font-weight="600" fill="#1a7f37">A</text>
      <text x="878" y="319" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+38 <tspan fill="#d1242f">−0</tspan></text>

      <text x="616" y="362" font-size="10" font-weight="600" letter-spacing="0.6" fill="#59636e">MEDIUM RISK</text><text x="922" y="362" font-size="10" font-weight="600" fill="#59636e">1/3</text>

      <rect x="616" y="374" width="12" height="12" rx="3" fill="#fff" stroke="#8c959f"/>
      <text x="636" y="383" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#59636e">src/api/routes/<tspan fill="#1f2328">token.ts</tspan></text>
      <text x="636" y="398" font-size="10.5" fill="#9a6700">security · public API</text>
      <rect x="854" y="372" width="15" height="15" rx="3" fill="none" stroke="#d1d9e0"/><text x="858" y="383" font-size="9.5" font-weight="600" fill="#59636e">M</text>
      <text x="878" y="383" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+64 <tspan fill="#d1242f">−9</tspan></text>

      <rect x="616" y="414" width="12" height="12" rx="3" fill="#fff" stroke="#8c959f"/>
      <text x="636" y="423" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#59636e">.github/workflows/<tspan fill="#1f2328">deploy.yml</tspan></text>
      <text x="636" y="438" font-size="10.5" fill="#9a6700">deploy</text>
      <rect x="854" y="412" width="15" height="15" rx="3" fill="none" stroke="#d1d9e0"/><text x="858" y="423" font-size="9.5" font-weight="600" fill="#59636e">M</text>
      <text x="878" y="423" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+6 <tspan fill="#d1242f">−2</tspan></text>

      <rect x="616" y="454" width="12" height="12" rx="3" fill="#1a7f37"/><path d="M619 460 l2.4 2.4 l4.2 -4.6" stroke="#fff" stroke-width="1.6" fill="none"/>
      <text x="636" y="464" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#59636e" opacity="0.5">src/lib/<tspan fill="#1f2328">cache.ts</tspan></text>
      <rect x="854" y="453" width="15" height="15" rx="3" fill="none" stroke="#d1d9e0"/><text x="858" y="464" font-size="9.5" font-weight="600" fill="#59636e">M</text>
      <text x="878" y="464" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+22 <tspan fill="#d1242f">−11</tspan></text>

      <text x="616" y="494" font-size="10" font-weight="600" letter-spacing="0.6" fill="#59636e">LOW RISK</text><text x="922" y="494" font-size="10" font-weight="600" fill="#59636e">3/4</text>
      <rect x="616" y="504" width="12" height="12" rx="3" fill="#fff" stroke="#8c959f"/>
      <text x="636" y="514" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#59636e">src/ui/<tspan fill="#1f2328">SessionBanner.tsx</tspan></text>
      <rect x="854" y="503" width="15" height="15" rx="3" fill="none" stroke="#d1d9e0"/><text x="858" y="514" font-size="9.5" font-weight="600" fill="#59636e">M</text>
      <text x="878" y="514" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a7f37">+18 <tspan fill="#d1242f">−6</tspan></text>
    </g>

    <!-- Footer -->
    <line x1="600" y1="532" x2="960" y2="532" stroke="#d1d9e0"/>
    <text x="616" y="560" font-size="11" fill="#59636e">Alt+J/K move · Alt+N next unviewed · Alt+V viewed · Alt+R panel</text>
  </g>
  <rect x="0.5" y="0.5" width="959" height="579" rx="11.5" fill="none" stroke="#d1d9e0"/>
</svg>
